name: Publicar
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar que la etiqueta coincide con system.json
        run: |
          V=$(jq -r .version system.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "system.json dice $V y la etiqueta es ${GITHUB_REF_NAME}"; exit 1; }
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mr-cuentos-de-animas.zip
            dist/system.json
          body_path: dist/release-notes.md
