name: Materialize realistic art
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".art-trigger"
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Download generated source art
        run: |
          curl -fL --retry 4 --retry-delay 2 "https://cdn.openart.ai/watermarked_images/YDayTSNGLhBV9JPeK9M3/thumbnail_b5247ec4_1790513731318.webp" -o /tmp/cda-table.webp
          curl -fL --retry 4 --retry-delay 2 "https://cdn.openart.ai/watermarked_images/YDayTSNGLhBV9JPeK9M3/thumbnail_e6a9220e_1790513449248.webp" -o /tmp/cda-cards.webp
      - name: Build photographic assets
        run: python scripts/make-realistic-assets.py --table /tmp/cda-table.webp --sheet /tmp/cda-cards.webp
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/*.webp assets/cards/*.webp assets/counters/*.webp docs/assets/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Materialize v1.0.1 realistic art assets"
          git push
