name: Bootstrap source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand prepared source
        run: python bootstrap.py
      - name: Publish source tree
        run: |
          rm -f bootstrap.py bootstrap.b64 bootstrap.part.* .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.0.0 · complete Foundry system"
          git push
